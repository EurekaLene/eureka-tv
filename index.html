<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eureka Water & Filtration</title>
<style>
  :root{
    --bg:#0b1017;
    --panel:#141b25;
    --panel2:#1a232f;
    --line:#26313f;
    --text:#eef2f7;
    --dim:#8c99ab;
    --dimmer:#5d6979;
    --green:#3fb950;
    --blue:#4a9eff;
    --amber:#e3a008;
    --orange:#f0883e;
    --purple:#a371f7;
    --pink:#f778ba;
    --red:#f85149;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;cursor:none}

  /* ---------- frame ----------
     Everything is laid out on a fixed 1920 x 1080 canvas and then scaled
     to whatever the screen actually is. Without this, a TV browser that
     reports a smaller viewport renders everything at giant size and cuts
     the bottom off. */
  #fit{position:absolute;top:0;left:0;width:1920px;height:1080px;
       transform-origin:0 0}
  #shell{position:absolute;inset:0;display:flex;flex-direction:column}

  header{height:96px;flex:0 0 96px;display:flex;align-items:center;gap:28px;
    padding:0 48px;background:var(--panel);border-bottom:1px solid var(--line)}
  .mark{display:flex;align-items:baseline;gap:12px}
  .mark .e{font-size:34px;font-weight:700;letter-spacing:-.5px}
  .mark .w{font-size:34px;font-weight:300;color:var(--dim)}
  .rule{width:1px;height:44px;background:var(--line)}
  #screenName{font-size:30px;font-weight:600;color:var(--text)}
  #headRight{margin-left:auto;display:flex;align-items:center;gap:32px}
  #dayline{font-size:24px;color:var(--dim);font-weight:400}
  #clock{font-size:40px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-1px}

  #bar{height:5px;flex:0 0 5px;background:var(--line)}
  #barFill{height:100%;width:0;background:var(--green);transition:width .25s linear}

  main{flex:1;position:relative;overflow:hidden}
  .screen{position:absolute;inset:0;padding:36px 48px 28px;opacity:0;
    transition:opacity .5s ease;pointer-events:none;overflow:hidden}
  .screen.live{opacity:1}

  /* ---------- kanban columns ---------- */
  .cols{display:flex;gap:24px;height:100%}
  .col{flex:1;min-width:0;display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .colhead{flex:0 0 auto;padding:18px 22px 16px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px}
  .pip{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
  .colname{font-size:23px;font-weight:600;letter-spacing:.2px}
  .count{margin-left:auto;font-size:20px;color:var(--dim);font-variant-numeric:tabular-nums;
    background:var(--panel2);padding:3px 12px;border-radius:20px}
  .colbody{flex:1;overflow:hidden;padding:16px 16px 8px;display:flex;flex-direction:column;gap:12px}
  .card{background:var(--panel2);border-radius:10px;padding:16px 18px;
    border-left:4px solid var(--line)}
  .card .t{font-size:21px;line-height:1.3;font-weight:500}
  .card .m{font-size:18px;color:var(--dim);margin-top:8px;line-height:1.35}
  .card .m b{color:var(--text);font-weight:600}
  .empty{color:var(--dimmer);font-size:19px;font-style:italic;padding:6px 4px}
  .more{color:var(--dimmer);font-size:18px;padding:2px 4px}

  /* ---------- calendar screen ---------- */
  .calwrap{display:flex;flex-direction:column;gap:26px;height:100%}
  .today{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:24px 28px}
  .today h3{font-size:22px;font-weight:600;color:var(--dim);letter-spacing:1.5px;
    text-transform:uppercase;margin-bottom:16px}
  .todayrow{display:flex;gap:36px;flex-wrap:wrap}
  .ev{display:flex;align-items:baseline;gap:14px}
  .ev .tm{font-size:26px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums}
  .ev .sb{font-size:26px}
  .ev .lc{font-size:20px;color:var(--dim)}

  .week{flex:1;display:flex;gap:14px;min-height:0}
  .day{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
  .day.weekend{background:#10161f}
  .dayhead{flex:0 0 auto;padding:14px 14px 12px;text-align:center;border-bottom:1px solid var(--line)}
  .dayhead .dw{font-size:19px;color:var(--dim);text-transform:uppercase;letter-spacing:1.2px}
  .dayhead .dn{font-size:34px;font-weight:600;line-height:1.1;margin-top:2px}
  .daybody{flex:1;padding:12px 12px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
  .slot{background:var(--panel2);border-left:3px solid var(--blue);border-radius:8px;padding:10px 11px}
  .slot.allday{border-left-color:var(--purple)}
  .slot .st{font-size:17px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
  .slot.allday .st{color:var(--purple)}
  .slot .ss{font-size:18px;line-height:1.25;margin-top:3px}
  .slot .sl{font-size:16px;color:var(--dim);margin-top:3px}

  /* ---------- insurance screen ----------
     A stat row over a plain list, rather than the kanban used by the boards.
     The useful comparison is "how many days" read straight down a single
     column, which side-by-side columns cannot give you.
     The stat row is the part that has to read from the far side of the room,
     so the numbers are large and the zeros are kept rather than hidden -
     "0 expired" is the whole point of the screen on a good day. */
  .inswrap{display:flex;flex-direction:column;gap:26px;height:100%}
  .insstats{flex:0 0 auto;display:flex;gap:24px}
  .stat{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);
    border-left-width:5px;border-left-style:solid;border-radius:14px;
    padding:20px 26px;display:flex;align-items:center;gap:22px}
  .stat .num{font-size:62px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .stat .lab{font-size:22px;color:var(--dim);font-weight:600;letter-spacing:.2px;line-height:1.25}
  .stat.red{border-left-color:var(--red)}       .stat.red .num{color:var(--red)}
  .stat.amber{border-left-color:var(--amber)}   .stat.amber .num{color:var(--amber)}
  .stat.purple{border-left-color:var(--purple)} .stat.purple .num{color:var(--purple)}
  .stat.green{border-left-color:var(--green)}   .stat.green .num{color:var(--green)}
  .stat.zero .num{color:var(--dimmer)}
  /* One row per policy, full width, so the Days column lines up and can be
     scanned straight down. The left edge carries the status colour. */
  .inslist{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px}
  .insrow{display:grid;grid-template-columns:1fr 210px 190px 200px;align-items:center;
    gap:20px;height:46px;padding:0 22px;background:var(--panel);
    border:1px solid var(--line);border-left-width:5px;border-left-style:solid;
    border-radius:10px}
  .insrow.head{height:28px;padding:0 23px 0 27px;background:none;border:0;
    font-size:16px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dimmer)}
  /* the header cells reuse .dy/.ex only to inherit their right alignment, so
     undo the type styling those classes carry for real rows */
  .insrow.head .dy,.insrow.head .ex{font:inherit;color:inherit;letter-spacing:inherit}
  .insrow .nm{font-size:22px;font-weight:500;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .insrow .rg{color:var(--dim);font-weight:400}
  .insrow .unc{font-size:15px;color:var(--dimmer);border:1px solid var(--line);
    border-radius:5px;padding:2px 7px;margin-left:12px;
    text-transform:uppercase;letter-spacing:.8px}
  .insrow .st{font-size:20px;font-weight:600}
  .insrow .dy{font-size:24px;font-weight:700;text-align:right;
    font-variant-numeric:tabular-nums}
  .insrow .dy small{font-size:17px;font-weight:400;color:var(--dim);margin-left:7px}
  .insrow .ex{font-size:20px;color:var(--dim);text-align:right}
  .insmore{font-size:18px;color:var(--dimmer);padding:6px 27px}

  .r-expired{border-left-color:var(--red)}
  .r-expired .st,.r-expired .dy{color:var(--red)}
  .r-soon{border-left-color:var(--amber)}
  .r-soon .st,.r-soon .dy{color:var(--amber)}
  .r-nodate{border-left-color:var(--purple)}
  .r-nodate .st{color:var(--purple)} .r-nodate .dy{color:var(--dimmer)}
  .r-insured{border-left-color:var(--green)}
  .r-insured .st{color:var(--green)} .r-insured .dy{color:var(--text)}

  /* ---------- riddle screen ----------
     Today's puzzle with no answer, and yesterday's puzzle with its answer
     revealed underneath. Answering today's on the same screen would remove
     the only reason to look again tomorrow. */
  .ridwrap{display:flex;flex-direction:column;gap:26px;height:100%}
  .ridmain{flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:40px 64px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:28px}
  .ridkind{font-size:20px;letter-spacing:1.6px;text-transform:uppercase;
    color:var(--dimmer);font-weight:600}
  .ridq{font-size:52px;line-height:1.3;font-weight:500;max-width:1520px}
  /* emoji puzzles carry no words, so they get the whole card */
  .ridq.big{font-size:150px;line-height:1.2;letter-spacing:18px}
  .ridhint{font-size:26px;color:var(--dim);max-width:1200px}
  .ridprev{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);
    border-left:5px solid var(--green);border-radius:14px;padding:20px 28px;
    display:flex;align-items:baseline;gap:24px}
  .ridprev .plab{font-size:18px;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--dimmer);font-weight:600;flex:0 0 auto}
  .ridprev .pq{font-size:21px;color:var(--dim);flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
  .ridprev .pa{font-size:26px;font-weight:700;color:var(--green);flex:0 0 auto}
  .off{display:none!important}

  footer{flex:0 0 46px;height:46px;display:flex;align-items:center;padding:0 48px;
    background:var(--panel);border-top:1px solid var(--line);font-size:17px;color:var(--dimmer)}
  #dots{margin-left:auto;display:flex;gap:9px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
  .dot.on{background:var(--green)}
</style>
</head>

<script>
(function(){
  "use strict";

  /* ---------- fit the 1920x1080 canvas to this screen ----------
     Add ?scale=0.8 to the address to override it by hand if a player
     reports a screen size that isn't the real one. */
  var fit = document.getElementById("fit");
  function resize(){
    var w = document.documentElement.clientWidth  || window.innerWidth  || 0;
    var h = document.documentElement.clientHeight || window.innerHeight || 0;

    /* Some players report 0 for a moment while starting up. Scaling by 0
       would blank the screen, so hold at full size and try again shortly. */
    if (w < 200 || h < 200){
      fit.style.transform = "scale(1)";
      setTimeout(resize, 400);
      return;
    }

    var s = Math.min(w/1920, h/1080);

    var forced = /[?&]scale=([0-9.]+)/.exec(location.search);
    if (forced && parseFloat(forced[1]) > 0) s = parseFloat(forced[1]);

    fit.style.transform = "translate(" + ((w - 1920*s)/2) + "px," +
                                        ((h - 1080*s)/2) + "px) scale(" + s + ")";
  }
  resize();
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", resize);
  /* some TV browsers report the wrong size for a moment after load */
  setTimeout(resize, 500);
  setTimeout(resize, 2500);

  var C = { blue:"var(--blue)", green:"var(--green)", amber:"var(--amber)",
            orange:"var(--orange)", purple:"var(--purple)", pink:"var(--pink)",
            red:"var(--red)", dim:"var(--dimmer)" };

  /* how many cards fit before we start summarising */
  var MAX_CARDS = 7;

  function buildCols(target, groups, dropEmpty){
    var host = document.getElementById(target);
    host.innerHTML = "";

    /* On the jobs screen, a column with nothing in it is wasted wall space.
       Hide empties, but never hide them all. */
    if (dropEmpty){
      var used = groups.filter(function(g){ return g.items.length; });
      if (used.length) groups = used;
    }

    groups.forEach(function(g){
      var col = document.createElement("div");
      col.className = "col";

      var head = document.createElement("div");
      head.className = "colhead";
      head.innerHTML =
        '<span class="pip" style="background:' + (C[g.colour]||C.dim) + '"></span>' +
        '<span class="colname">' + g.status + '</span>' +
        '<span class="count">' + g.items.length + '</span>';
      col.appendChild(head);

      var body = document.createElement("div");
      body.className = "colbody";

      if (!g.items.length){
        body.innerHTML = '<div class="empty">Nothing here</div>';
      } else {
        g.items.slice(0, MAX_CARDS).forEach(function(it){
          var c = document.createElement("div");
          c.className = "card";
          c.style.borderLeftColor = C[g.colour] || C.dim;
          c.innerHTML = '<div class="t">' + it.t + '</div>' +
                        (it.m ? '<div class="m">' + it.m + '</div>' : '');
          body.appendChild(c);
        });
        if (g.items.length > MAX_CARDS){
          var more = document.createElement("div");
          more.className = "more";
          more.textContent = "+ " + (g.items.length - MAX_CARDS) + " more";
          body.appendChild(more);
        }
      }
      col.appendChild(body);
      host.appendChild(col);
    });
  }

  function buildCalendar(){
    document.getElementById("todayHead").textContent = "Today  ·  " + DATA.today.heading;

    var row = document.getElementById("todayRow");
    row.innerHTML = "";
    if (!DATA.today.events.length){
      row.innerHTML = '<div class="empty">Nothing scheduled today</div>';
    } else {
      DATA.today.events.forEach(function(e){
        var d = document.createElement("div");
        d.className = "ev";
        d.innerHTML = '<span class="tm">' + e.tm + '</span>' +
                      '<span class="sb">' + e.sb + '</span>' +
                      (e.lc ? '<span class="lc">' + e.lc + '</span>' : '');
        row.appendChild(d);
      });
    }

    var grid = document.getElementById("weekGrid");
    grid.innerHTML = "";
    DATA.week.forEach(function(d){
      var day = document.createElement("div");
      day.className = "day" + (d.weekend ? " weekend" : "");
      day.innerHTML = '<div class="dayhead"><div class="dw">' + d.dw + '</div>' +
                      '<div class="dn">' + d.dn + '</div></div>';
      var body = document.createElement("div");
      body.className = "daybody";
      d.events.forEach(function(e){
        var s = document.createElement("div");
        s.className = "slot" + (e.allday ? " allday" : "");
        s.innerHTML = '<div class="st">' + e.tm + '</div>' +
                      '<div class="ss">' + e.sb + '</div>' +
                      (e.lc ? '<div class="sl">' + e.lc + '</div>' : '');
        body.appendChild(s);
      });
      day.appendChild(body);
      grid.appendChild(day);
    });
  }

  /* ---------- insurance ----------
     "insurance" was added to the data after the first three screens existed, so
     a data page written by an older scheduled task can arrive without it.
     Normalise it here and let the rotation drop the screen when there is
     nothing to show, rather than parking a blank panel on the wall. */
  var insRows = (DATA.insurance || []).filter(function(r){ return r && r.t; });

  var INS_STATE = {
    expired: { cls:"r-expired", lab:"Expired" },
    soon:    { cls:"r-soon",    lab:"Expiring soon" },
    nodate:  { cls:"r-nodate",  lab:"No expiry date" },
    insured: { cls:"r-insured", lab:"Covered" }
  };

  /* Fourteen 46px rows plus the header is what fits under the stat row on a
     1080-high canvas. The whole register should be visible on a compliance
     screen, so this is set to fit the fleet with room to grow rather than
     to a tidy round number. Past it, the last row becomes a "+ n more" line
     rather than letting the list run off the bottom of the screen. */
  var MAX_INS_ROWS = 14;

  var INS_STATS = [
    { k:"expired", cls:"red",    lab:"Expired" },
    { k:"soon",    cls:"amber",  lab:"Expiring<br>within 30 days" },
    { k:"nodate",  cls:"purple", lab:"No expiry<br>date recorded",
      hideWhenZero:true },
    { k:"insured", cls:"green",  lab:"Covered" }
  ];

  function buildInsurance(){
    var count = { expired:0, soon:0, nodate:0, insured:0 };
    insRows.forEach(function(r){
      if (count[r.state] !== undefined){ count[r.state]++; }
    });

    var host = document.getElementById("insStats");
    host.innerHTML = "";
    INS_STATS.forEach(function(s){
      var n = count[s.k];
      if (s.hideWhenZero && !n){ return; }
      var d = document.createElement("div");
      d.className = "stat " + s.cls + (n ? "" : " zero");
      d.innerHTML = '<span class="num">' + n + '</span>' +
                    '<span class="lab">' + s.lab + '</span>';
      host.appendChild(d);
    });

    var list = document.getElementById("insList");
    list.innerHTML =
      '<div class="insrow head"><span>Insured item</span><span>Status</span>' +
      '<span class="dy">Days</span><span class="ex">Expires</span></div>';

    var shown = insRows, hidden = 0;
    if (shown.length > MAX_INS_ROWS){
      hidden = shown.length - (MAX_INS_ROWS - 1);
      shown = shown.slice(0, MAX_INS_ROWS - 1);
    }

    shown.forEach(function(r){
      var st = INS_STATE[r.state] || INS_STATE.nodate;
      var days = "&#8212;";
      if (typeof r.days === "number"){
        days = r.days + "<small>" +
               (r.state === "expired" ? "over" : "left") + "</small>";
      }
      var row = document.createElement("div");
      row.className = "insrow " + st.cls;
      row.innerHTML =
        '<div class="nm">' + r.t +
          (r.rego ? ' <span class="rg">&#183; ' + r.rego + '</span>' : '') +
          (r.unconfirmed ? '<span class="unc">Unconfirmed</span>' : '') +
        '</div>' +
        '<div class="st">' + st.lab + '</div>' +
        '<div class="dy">' + days + '</div>' +
        '<div class="ex">' + (r.expiry || "&#8212;") + '</div>';
      list.appendChild(row);
    });

    if (hidden){
      var more = document.createElement("div");
      more.className = "insmore";
      more.textContent = "+ " + hidden + " more";
      list.appendChild(more);
    }
  }

  /* ---------- riddle ----------
     Optional, like insurance. No riddle on the page means the screen is left
     out of the rotation rather than showing an empty card. */
  var rid = (DATA.riddle && DATA.riddle.q) ? DATA.riddle : null;

  function buildRiddle(){
    document.getElementById("ridKind").textContent = rid.type || "Riddle of the day";

    var q = document.getElementById("ridQ");
    q.textContent = rid.q;
    /* An emoji puzzle has no letters in it. Test for that rather than for a
       short string, so a short worded riddle is not blown up to 150px. */
    q.className = "ridq" + (/[a-z]/i.test(rid.q) ? "" : " big");

    var hint = document.getElementById("ridHint");
    hint.textContent = rid.hint || "";
    hint.className = rid.hint ? "ridhint" : "ridhint off";

    var prev = document.getElementById("ridPrev");
    if (rid.prev && rid.prev.a){
      document.getElementById("ridPQ").textContent = rid.prev.q || "";
      document.getElementById("ridPA").textContent = rid.prev.a;
      prev.className = "ridprev";
    } else {
      prev.className = "ridprev off";
    }
  }

  /* ---------- clock ---------- */
  var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var MONTHS = ["January","February","March","April","May","June","July",
                "August","September","October","November","December"];
  function tick(){
    var d = new Date(), h = d.getHours(), m = d.getMinutes();
    var ap = h < 12 ? "am" : "pm", h12 = h % 12 || 12;
    document.getElementById("clock").textContent =
      h12 + ":" + (m<10?"0":"") + m + ap;
    document.getElementById("dayline").textContent =
      DAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()];
  }
  tick(); setInterval(tick, 10000);

  document.getElementById("stamp").textContent = "Updated " + DATA.generated;

  /* ---------- rotation ---------- */
  var NAMES = ["Jobs", "Quotes", "Calendar"];
  var screens = [document.getElementById("s0"),
                 document.getElementById("s1"),
                 document.getElementById("s2")];

  if (insRows.length){
    NAMES.push("Insurance");
    screens.push(document.getElementById("s3"));
  }
  if (rid){
    NAMES.push("Riddle");
    screens.push(document.getElementById("s4"));
  }

  /* One dot per screen, built to match however many screens we ended up with. */
  var dotHost = document.getElementById("dots"), dots = [];
  screens.forEach(function(){
    var d = document.createElement("div");
    d.className = "dot";
    dotHost.appendChild(d);
    dots.push(d);
  });

  var fill = document.getElementById("barFill");
  var i = -1, t = null, p = null;

  function show(n){
    i = n;
    screens.forEach(function(s,k){ s.classList.toggle("live", k===n); });
    dots.forEach(function(d,k){ d.classList.toggle("on", k===n); });
    document.getElementById("screenName").textContent = NAMES[n];

    var ms = SECONDS_PER_SCREEN * 1000, start = Date.now();
    clearInterval(p); fill.style.width = "0%";
    p = setInterval(function(){
      var pct = (Date.now()-start)/ms*100;
      if (pct >= 100){ pct = 100; clearInterval(p); }
      fill.style.width = pct + "%";
    }, 250);

    clearTimeout(t);
    t = setTimeout(function(){ show((i+1) % screens.length); }, ms);
  }

  document.addEventListener("keydown", function(e){
    if (e.key === "ArrowRight"){ show((i+1) % screens.length); }
    else if (e.key === "ArrowLeft"){ show((i-1+screens.length) % screens.length); }
  });

  /* the page reloads itself every 10 minutes so a refreshed build appears
     without anyone touching the TV */
  setTimeout(function(){ location.reload(); }, 10*60*1000);

  buildCols("jobCols",   DATA.jobs, true);
  buildCols("quoteCols", DATA.quotes, false);
  buildCalendar();
  if (insRows.length){ buildInsurance(); }
  if (rid){ buildRiddle(); }
  show(0);
})();
</script>
</body>
</html>
